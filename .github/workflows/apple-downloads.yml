name: Apple downloads

# Experiment: fetches Apple's signed-in list of developer downloads with xcodes,
# on a self-hosted runner, to see how reliably it runs unattended. Each run
# signs in to Apple again, so it only runs when started by hand.
on:
  workflow_dispatch:

concurrency:
  group: apple-downloads

permissions: {}

jobs:
  fetch:
    runs-on: [self-hosted, apple]
    timeout-minutes: 10

    steps:
    - name: Fetch
      # xcodes' output can name the account, so it stays on the runner.
      run: |
        "$HOME/.local/bin/mise" x xcodes@2.2.0 -- xcodes update --data-source apple < /dev/null > "$RUNNER_TEMP/xcodes.log" 2>&1
        cp "$HOME/Library/Application Support/com.robotsandpencils.xcodes/available-xcodes.json" "$RUNNER_TEMP/apple-downloads.json"
        python3 -c 'import json, sys; print(len(json.load(open(sys.argv[1]))), "releases")' "$RUNNER_TEMP/apple-downloads.json"

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: apple-downloads
        path: ${{ runner.temp }}/apple-downloads.json
